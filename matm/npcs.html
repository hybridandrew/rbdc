    function getInitials(name) {
      // Strip parenthetical aliases, then take first letter of first two words
      const clean = name.replace(/\s*\(.*?\)\s*/g, '').trim();
      const words = clean.split(/\s+/).filter(Boolean);
      if (words.length === 1) return words[0].slice(0, 2).toUpperCase();
      return (words[0][0] + words[1][0]).toUpperCase();
    }

    function renderNpcCard(npc) {
      const connectionsHTML = npc.connections && npc.connections.length > 0
        ? `<div class="npc-connections">
            <span class="npc-connections-label">Connected to:</span>
            ${npc.connections.map(c =>
              c.href
                ? `<a href="${c.href}" class="npc-connection-link">${c.name}</a>`
                : `<span class="npc-connection-plain">${c.name}</span>`
            ).join(', ')}
           </div>`
        : '';

      const portraitClass = npc.portraitClass || 'neutral';
      const initials = getInitials(npc.name);

      return `
        <div class="npc-card">
          <div class="npc-card-header">
            <div class="npc-portrait ${portraitClass}" aria-hidden="true">${initials}</div>
            <div class="npc-card-header-text">
              <h3 class="npc-name">${npc.name}</h3>
              <p class="npc-title">${npc.title}</p>
            </div>
          </div>
          <p class="npc-description">${npc.description}</p>
          ${connectionsHTML}
          <span class="npc-status ${npc.status}">${npc.statusText}</span>
        </div>
      `;
    }
